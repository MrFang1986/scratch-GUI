name: Test Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - List all files
        run: |
          echo "Current directory: $(pwd)"
          echo "=== Root directory contents ==="
          ls -la
          echo "=== Recursive search for gradlew ==="
          find . -name "gradlew" 2>/dev/null || echo "gradlew not found"
          echo "=== Recursive search for build.gradle ==="
          find . -name "build.gradle*" 2>/dev/null || echo "build.gradle not found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          # 如果 gradlew 在子目录，先 cd 进去
          if [ -f "android/gradlew" ]; then
            cd android
          elif [ -f "app/gradlew" ]; then
            cd app
          fi
          
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --daemon --warning-mode all

      - name: Prepare APK
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          find . -path "*/build/outputs/apk/*.apk" -exec cp {} ${{ github.workspace }}/apk/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: com.github.tvbox.osc
          path: ${{ github.workspace }}/apk/*.apk
          retention-days: 7
