name: Build Scratch GUI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 修复1：清理缓存并完整安装依赖
      - name: Install dependencies
        run: |
          # 清理可能的缓存问题
          rm -rf node_modules package-lock.json
          # 使用 --force 解决依赖冲突
          npm install --force --legacy-peer-deps
          # 确保 react 正确安装
          npm list react || echo "React not found, reinstalling..."
          npm install react react-dom --save

      - name: Build Scratch GUI
        run: |
          # 尝试构建
          npm run build
          
          # 如果构建失败，尝试使用 CI=false 忽略警告
          if [ $? -ne 0 ]; then
            echo "Build failed, trying with CI=false..."
            CI=false npm run build
          fi
          
          # 验证构建产物
          if [ ! -d "build" ]; then
            echo "Build directory not found!"
            exit 1
          fi
          echo "Build successful! Size:"
          du -sh build/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create scratch-app org.scratch.gui.app "Scratch GUI"
          rm -rf scratch-app/www/*
          cp -r build/* scratch-app/www/
          cd scratch-app
          cordova platform add android
          
          # 配置 config.xml
          cat > config.xml << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="org.scratch.gui.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Scratch GUI</name>
              <description>Scratch GUI App</description>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-navigation href="*" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
              <preference name="orientation" value="landscape" />
          </widget>
          EOF
          
          cordova plugin add cordova-plugin-whitelist

      - name: Build APK
        run: |
          cd scratch-app
          cordova build android
          
          # 查找并确认 APK
          APK_PATH=$(find . -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "APK found at: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "No APK generated!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Scratch-GUI-APK
          path: scratch-app/platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
