name: Package Scratch GUI to APK

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Scratch GUI code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Scratch GUI
        run: |
          npm ci
          npm run build

      - name: Setup Java (for Cordova/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project and add Android platform
        run: |
          cordova create scratch-app org.scratch.gui.app "Scratch GUI"
          cd scratch-app
          # 将构建好的网页复制到 Cordova 的 www 目录
          cp -r ../build/* www/
          cordova platform add android
          cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scratch-gui-app
          path: scratch-app/platforms/android/app/build/outputs/apk/release/*.apk
